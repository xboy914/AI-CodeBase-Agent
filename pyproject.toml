[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-codebase-agent"
version = "0.2.0"
description = "A retrieval-augmented AI agent for understanding React and TypeScript codebases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "openai>=1.50",
  "pydantic-settings>=2.5",
  "qdrant-client>=1.11",
  "tree-sitter-language-pack>=0.9",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
codebase-agent = "codebase_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
